name: Monitor Geoserver HD layers

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

permissions:
  contents: write

env:
  INSTATUS_API_KEY: ${{ secrets.INSTATUS_API_KEY }}
  INSTATUS_PAGE_ID: ${{ secrets.INSTATUS_PAGE_ID }}
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY_ID }}
  AWS_REGION: eu-west-3
  S3_BUCKET: instatus-bucket
  S3_KEY: instatus-server-requests.json
  FILE: .github/workflows/instatus-server-requests.json

jobs:
  monitor-HD-layers:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick jq bc

      - name: Setup AWS credentials
        uses: aws-actions/configure-aws-credentials@v4.0.1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_ID }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download HD config from S3
        run: |
          set -e

          if ! aws s3 cp s3://${{ env.S3_BUCKET }}/${{ env.S3_KEY }} ./config.json; then
            echo "S3 file not found, using empty config"
            echo '[]' > ./config.json
          fi

          if ! jq empty ./config.json; then
            echo "Invalid JSON in S3, using empty config"
            echo '[]' > ./config.json
          fi

          cp ./config.json "${{ env.FILE }}"

          echo "Final file content: ${{ env.FILE }}"

      - name: Monitor HD layers and manage incidents
        run: |
          set -e

          if [ ! -f "$FILE" ]; then
            echo "Configuration file not found!"
            exit 1
          fi

          echo "Fetching all components status once..."
          COMPONENTS_JSON=$(curl -s \
            "https://api.instatus.com/v2/$INSTATUS_PAGE_ID/components?page=1&per_page=50" \
            -H "Authorization: Bearer $INSTATUS_API_KEY")
          
          if ! echo "$COMPONENTS_JSON" | jq empty 2>/dev/null; then
            echo "Failed to fetch components or invalid JSON."
            echo "$COMPONENTS_JSON"
            exit 1
          fi

          jq -c '.[]' "$FILE" | while read item; do
            URL=$(echo "$item" | jq -r '.url')
            COMPONENT_ID=$(echo "$item" | jq -r '.componentId')
            LAYER=$(echo "$item" | jq -r '.layer')
            INCIDENT_ID=$(echo "$item" | jq -r '.incidentId')

            echo "--------------------------------------"
            echo "Checking layer: $LAYER"

            HEADERS=$(mktemp)
            BODY=$(mktemp)

            curl -s --max-time 120 -D "$HEADERS" -o "$BODY" "$URL"

            HTTP_CODE=$(head -n 1 "$HEADERS" | awk '{print $2}')
            CONTENT_TYPE=$(grep -i "^content-type" "$HEADERS" | awk '{print $2}' | tr -d '\r')

            echo "HTTP Code: $HTTP_CODE"
            echo "Content-Type: $CONTENT_TYPE"

            # Search component status
            CURRENT_COMPONENT_STATUS=$(echo "$COMPONENTS_JSON" | \
              jq -r ".[] | select(.id == \"$COMPONENT_ID\") | .internalStatus")
          
            echo "Current Component status: $CURRENT_COMPONENT_STATUS"

            MONITORING_FAILED=false

            if [[ "$HTTP_CODE" != "200" || "$CONTENT_TYPE" != image/* ]]; then
              MONITORING_FAILED=true
            else
              STDDEV=$(convert "$BODY" -resize 100x100 -colorspace Gray \
                -format "%[standard-deviation]" info: 2>/dev/null || echo "error")

              if [[ "$STDDEV" == "error" ]] || (( $(echo "$STDDEV < 0.001" | bc -l) )); then
                MONITORING_FAILED=true
              fi
            fi

            echo "Monitoring failed: $MONITORING_FAILED"

            # ===================================================
            # CASE 1: KO + OPERATIONAL → CREATE INCIDENT
            # ===================================================
          
            if [[ "$MONITORING_FAILED" = true && "$CURRENT_COMPONENT_STATUS" = "OPERATIONAL" ]]; then
              echo "Creating incident and updating component status ..."

              INCIDENT_RESPONSE=$(curl -s -X POST \
                "https://api.instatus.com/v1/$INSTATUS_PAGE_ID/incidents" \
                -H "Authorization: Bearer $INSTATUS_API_KEY" \
                -H "Content-Type: application/json" \
                -d "{
                      \"name\": \"Layer unavailable: $LAYER\",
                      \"message\": \"Layer $LAYER is not returning a valid image (HTTP $HTTP_CODE)\",
                      \"components\": [\"$COMPONENT_ID\"],
                      \"status\": \"INVESTIGATING\",
                      \"statuses\": {
                        \"id\": \"$COMPONENT_ID\",
                        \"status\": \"PARTIALOUTAGE\"
                      },
                      \"notify\": true
                    }")

              if echo "$INCIDENT_RESPONSE" | jq empty 2>/dev/null; then
                NEW_INCIDENT_ID=$(echo "$INCIDENT_RESPONSE" | jq -r '.id')

                jq --arg cid "$COMPONENT_ID" \
                   --arg iid "$NEW_INCIDENT_ID" \
                   'map(if .componentId == $cid then .incidentId = $iid else . end)' \
                   "$FILE" > tmp.json && mv tmp.json "$FILE"
              else
                echo "Invalid JSON from incident creation:"
                echo "$INCIDENT_RESPONSE"
              fi

            # ========================================================================
            # CASE 2: KO + PARTIALOUTAGE → INCIDENT IN PROGRESS, DO NOT CREATE ANYMORE
            # ========================================================================
          
            elif [[ "$MONITORING_FAILED" = true && "$CURRENT_COMPONENT_STATUS" = "PARTIALOUTAGE" ]]; then
              echo "Already in PARTIALOUTAGE. No action."

            # ========================================================================
            # CASE 3: OK + PARTIALOUTAGE → MONITORING OK, RESOLVE CURRENT INCIDENT
            # ========================================================================
          
            elif [[ "$MONITORING_FAILED" = false && \
                    "$CURRENT_COMPONENT_STATUS" = "PARTIALOUTAGE" && \
                    "$INCIDENT_ID" != "null" ]]; then

              echo "Resolving incident $INCIDENT_ID..."

              STARTED=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

              curl -s -X PUT \
                "https://api.instatus.com/v1/$INSTATUS_PAGE_ID/incidents/$INCIDENT_ID" \
                -H "Authorization: Bearer $INSTATUS_API_KEY" \
                -H "Content-Type: application/json" \
                -d "{
                      \"name\": \"Layer available: $LAYER\",
                      \"started\": \"$STARTED\",
                      \"components\": [\"$COMPONENT_ID\"],
                      \"status\": \"RESOLVED\",
                      \"impact\": \"NONE\",
                      \"notify\": true,
                    }"

              curl -s -X PUT \
                "https://api.instatus.com/v2/$INSTATUS_PAGE_ID/components/$COMPONENT_ID" \
                -H "Authorization: Bearer $INSTATUS_API_KEY" \
                -H "Content-Type: application/json" \
                -d "{
                    \"description\": \"Layer $LAYER is available\",
                    \"status\": \"OPERATIONAL\"
                    }"

              jq --arg cid "$COMPONENT_ID" \
                 'map(if .componentId == $cid then .incidentId = null else . end)' \
                 "$FILE" > tmp.json && mv tmp.json "$FILE"

              echo "Incident resolved."

            else
              echo "No action required."
            fi

            rm -f "$HEADERS" "$BODY"
          done   

      - name: Upload config to S3
        run: |
          # Sauvegarder la config actuelle
          cp ${{ env.FILE }} ./config-upload.json
          
          # Upload vers S3
          aws s3 cp ./config-upload.json s3://${{ env.S3_BUCKET }}/${{ env.S3_KEY }} \
            --cache-control no-cache \
            --metadata "updated=$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          
          echo "Configuration uploaded to S3"